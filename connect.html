<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Connect — Consciousness Calling</title>
<link rel="icon" href="assets/img/img-02-emblem.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main id="main">
<section class="block">
  <div class="wrap">
    <div class="narrow">
      <p class="eyebrow">Connect</p>
      <h1>Connect</h1>
      <p>Follow the book’s publication, join Inner Sun, or contact the author.</p>
    </div>

    <div class="grid g2" style="margin-top:2em">
      <div class="card" id="updates">
        <h2>Follow Book Updates</h2>
        <p>Be told when Book One is published.</p>
        <form class="stack" data-demo>
          <label>Name <input type="text" name="name" autocomplete="name"></label>
          <label>Email <input type="email" name="email" autocomplete="email" required></label>
          <button class="btn" type="submit">Follow Book Updates</button>
          <p class="form-msg" role="status"></p>
        </form>
      </div>

      <div class="card" id="contact">
        <h2>Contact the Author</h2>
        <form class="stack" data-demo>
          <label>Name <input type="text" name="name" autocomplete="name"></label>
          <label>Email <input type="email" name="email" autocomplete="email" required></label>
          <label>Message <textarea name="message" rows="4"></textarea></label>
          <button class="btn" type="submit">Send</button>
          <p class="form-msg" role="status"></p>
        </form>
      </div>
    </div>

    <div class="card" id="inner-sun" style="margin-top:18px">
      <h2>Join Inner Sun</h2>
      <!-- Blank: author to supply the Inner Sun connection (group, form or contact). -->
      <p>Recognize the Presence within. Allow Light and Love to become your way of living.</p>
      <dl class="spec" aria-label="Inner Sun connection">
        <div><dt>Connect via</dt><dd class="blank"></dd></div>
        <div><dt>Link</dt><dd class="blank"></dd></div>
      </dl>
    </div>
  </div>
</section>
</main>
<script src="js/site.js"></script>
</body>
</html>
